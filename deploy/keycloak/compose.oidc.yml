# Overlay for the supplied cm-docker-compose.yaml. Generate ./keycloak-generated first.
# All relative paths resolve against the FIRST Compose file's directory.
services:
  keycloak-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?generate oidc.env first}
    volumes:
      - keycloak-db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command: [start, --import-realm]
    ports:
      - "18080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://${CM_PUBLIC_HOST:-cm.internal}:18080
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak-generated/cm-realm.json:/opt/keycloak/data/import/cm-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  coassist:
    environment:
      OIDC_ENABLED: "true"
      OIDC_ISSUER: http://${CM_PUBLIC_HOST:-cm.internal}:18080/realms/cm
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/cm
      OIDC_CLIENT_ID: coassist
      OIDC_CLIENT_SECRET: ${COASSIST_OIDC_SECRET:?required}
      OIDC_API_SECRET: ${COASSIST_API_SECRET:?required}
      OIDC_WORKER_CLIENT_ID: coassist-worker
      OIDC_WORKER_CLIENT_SECRET: ${COASSIST_WORKER_SECRET:?required}
      OIDC_REDIRECT_URI: http://${CM_PUBLIC_HOST:-cm.internal}:19080/api/v1/auth/oidc/callback
      OIDC_FRONTEND_URL: http://${CM_PUBLIC_HOST:-cm.internal}:19080/login
      OIDC_COOKIE_SECURE: "false"
      OIDC_TOKEN_ENCRYPTION_KEY: ${OIDC_TOKEN_ENCRYPTION_KEY:?required}
      KNOWLEDGE_API_BASE_URL: http://htknow:3000
    depends_on:
      keycloak:
        condition: service_started

  htknow:
    environment:
      HTKNOW_AUTH_MODE: oidc
      HTKNOW_OIDC_ISSUER: http://${CM_PUBLIC_HOST:-cm.internal}:18080/realms/cm
      HTKNOW_OIDC_INTERNAL_URL: http://keycloak:8080/realms/cm
      HTKNOW_OIDC_CLIENT_ID: htknow
      HTKNOW_OIDC_CLIENT_SECRET: ${HTKNOW_OIDC_SECRET:?required}
      HTKNOW_OIDC_API_SECRET: ${HTKNOW_API_SECRET:?required}
      HTKNOW_OIDC_REDIRECT_URI: http://${CM_PUBLIC_HOST:-cm.internal}:11000/api/auth/callback
      HTKNOW_PUBLIC_URL: http://${CM_PUBLIC_HOST:-cm.internal}:11000
    depends_on:
      keycloak:
        condition: service_started

volumes:
  keycloak-db:
