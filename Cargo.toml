[package]
name = "htknow"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono"] }

log = "0.4"
log4rs = "1.3.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
