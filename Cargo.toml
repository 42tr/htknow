[package]
name = "htknow"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono"] }
lazy_static = "1.4"
log = "0.4"
log4rs = "1.3.0"

lancedb = "0.15"
arrow-array = "53"
arrow-schema = "53"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "multipart"] }

once_cell = "1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Swagger/OpenAPI 文档
utoipa = { version = "5.3", features = ["axum_extras", "chrono"] }

tantivy = "0.22"
jieba-rs = "0.6"

sha2 = "0.10"
hex = "0.4"

rust-embed = "8"
mime_guess = "2"
uuid = "1.19.0"
base64 = "0.22.1"

# 知识图谱相关依赖
petgraph = "0.6"          # 图数据结构
bincode = "1.3"           # 序列化图结构
aho-corasick = "1.0"      # 高效字符串匹配（词典）
regex = "1"               # 正则表达式
lru = "0.12"              # LRU缓存

# PDF 操作
lopdf = "0.36"

# etcd 配置中心（可选）
etcd-client = { version = "0.14", optional = true }
serde_with = "3.16.1"

[features]
default = []
etcd = ["etcd-client"]

[dev-dependencies]
http-body-util = "0.1"
tower = "0.5"
