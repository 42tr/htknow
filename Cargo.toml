[package]
name = "htknow"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono"] }
lazy_static = "1.4"
log = "0.4"
log4rs = "1.3.0"
qdrant = { version = "1.9", default-features = false, features = ["storage"] }
once_cell = "1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tantivy = "0.22"
jieba-rs = "0.6"

sha2 = "0.10"
hex = "0.4"

rust-embed = "8"
mime_guess = "2"
uuid = "1.19.0"
