# 当推送 git tag（如 v1.0.1）时：
#   1. 分别构建 x86_64 / arm64 的发布二进制，并打包成 tar.gz
#   2. 构建 linux/amd64 + linux/arm64 多架构 Docker 镜像并推送到 ghcr.io 和阿里云 ACR
#   3. 创建 GitHub Release 并上传二进制包
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  RUST_VERSION: "1.97.1"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            deb_arch: amd64
            cross: false
          - target: aarch64-unknown-linux-gnu
            deb_arch: arm64
            cross: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
          rustup target add "${{ matrix.target }}"
          rustc --version
          cargo --version

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # protobuf-compiler: protoc 可执行文件；libprotobuf-dev: google/protobuf/*.proto 头文件
          packages="protobuf-compiler libprotobuf-dev"
          if [ "${{ matrix.cross }}" = "true" ]; then
            packages="${packages} gcc-aarch64-linux-gnu g++-aarch64-linux-gnu"
          fi
          sudo apt-get install -y --no-install-recommends ${packages}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (embedded into the Rust binary)
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p "dist/${{ matrix.deb_arch }}"
          cp "target/${{ matrix.target }}/release/htknow" "dist/${{ matrix.deb_arch }}/htknow"
          chmod +x "dist/${{ matrix.deb_arch }}/htknow"
          tar -czf "htknow-${version}-${{ matrix.target }}.tar.gz" \
            -C "dist/${{ matrix.deb_arch }}" htknow
          ls -lh "htknow-${version}-${{ matrix.target }}.tar.gz"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: htknow-${{ matrix.deb_arch }}
          path: dist/${{ matrix.deb_arch }}/htknow
          if-no-files-found: error

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: htknow-${{ matrix.target }}-tarball
          path: htknow-*.tar.gz
          if-no-files-found: error

  docker:
    name: Build & push Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare multi-arch build context
        run: |
          set -euo pipefail
          mkdir -p dist/amd64 dist/arm64
          find artifacts/htknow-amd64 -type f -name htknow -exec cp {} dist/amd64/htknow \;
          find artifacts/htknow-arm64 -type f -name htknow -exec cp {} dist/arm64/htknow \;
          chmod +x dist/amd64/htknow dist/arm64/htknow
          ls -lh dist/amd64/htknow dist/arm64/htknow

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: crpi-gz6f3ok0ezphywc8.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            crpi-gz6f3ok0ezphywc8.cn-shanghai.personal.cr.aliyuncs.com/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: htknow-*-tarball
          path: packages
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
